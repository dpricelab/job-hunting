rules:
  min_score: 4
  remote_only: false
  max_age_days: 0
  title_include:
  - re:\bpublish(er|ers|ing)\b
  - re:\beditor(s|ial)?\b
  - re:\bjournals?\b
  - re:peer[ -]review
  - re:\bcommissioning\b
  title_exclude:
  - intern
  - internship
  - graduate
  - apprentice
  - placement
  - re:\bvideo\b
  - re:\bcopy[- ]?desk\b
  - re:\bassistants?\b
  - re:\bcoordinators?\b
  location_include:
  - London
  - Remote
  location_exclude: []
  exclude_keywords: []
  keywords:
    re:\bpublisher\b: 6
    re:\bjournals?\s+(manager|publishing manager)\b: 6
    re:\b(managing|commissioning|senior|acquisitions|publishing)\s+editor\b: 5
    re:\beditor(ial)?\b: 3
    re:\bpeer[ -]review\s+manager\b: 5
    re:\bpeer[ -]review: 2
    open access: 2
    scholarly: 2
    re:\bjournals?\b: 2
    portfolio: 1
    manuscript: 1
    London: 2
  title_bonus: 2
