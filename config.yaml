rules:
  min_score: 4
  remote_only: false
  max_age_days: 0
  title_include:
  - re:\bpublish(er|ers|ing)\b
  - re:\beditor(s|ial)?\b
  - re:\bjournals?\b
  - re:peer[ -]review
  - re:\bcommissioning\b
  - re:\bcontent\b
  - re:\bportfolio\b
  title_exclude:
  - intern
  - internship
  - graduate
  - apprentice
  - placement
  - re:\bvideo\b
  - re:\bcopy[- ]?desk\b
  - re:\bassistants?\b
  - re:\bcoordinators?\b
  # Above the level being aimed at. Catches "Chief Editor" and
  # "Editor-in-Chief" alike, since hyphens count as word boundaries.
  - chief

  # London, remote, and the Oxford–Cambridge axis where most UK scholarly
  # publishing actually sits. Matched as prefixes so Oxford also covers
  # Oxfordshire, and Abingdon covers "Abingdon on Thames" — the exact string
  # Taylor & Francis use for their journals base, and the reason Oxford alone
  # would not have surfaced those roles.
  location_include:
  - London
  - re:\boxford
  - re:\babingdon
  - re:\bcambridge
  - re:\bremote\b[^a-z]*\b(uk|gbr|united kingdom|england|britain|europe|emea)\b
  - re:\b(uk|gbr|united kingdom|england|britain)\b[^a-z]*\bremote\b
  - re:^\s*remote\s*$

  location_exclude:
  - United States
  - USA
  # Boards put the country last as a code, lower case on SmartRecruiters:
  # "Newton, MA, us". Anything ending in a two-letter code that is not GB or
  # UK is abroad. Load-bearing here: Cambridge Massachusetts, Oxford
  # Mississippi and London Ontario all read as matches on the city name.
  - re:,\s*(?!gb\b|uk\b)[a-z]{2}\s*$
  exclude_keywords: []
  keywords:
    re:\bpublisher\b: 6
    re:\bjournals?\s+(manager|publishing manager)\b: 6
    re:\b(managing|commissioning|senior|acquisitions|publishing)\s+editor\b: 5
    re:\beditor(ial)?\b: 3
    re:\bpeer[ -]review\s+manager\b: 5
    re:\bhead\s+of\s+content\b: 5
    re:\bcontent\s+(director|lead|manager|strategist)\b: 4
    re:\bportfolio\s+(manager|director|lead|head)\b: 5
    re:\bcontent\b: 2
    re:\bpeer[ -]review: 2
    open access: 2
    scholarly: 2
    re:\bjournals?\b: 2
    portfolio: 1
    manuscript: 1
    London: 2
  title_bonus: 2
